<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bgBrush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142120"/>
      <stop offset="100%" stop-color="#0d1413"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" rx="10" fill="url(#bgBrush)"/>
  <!-- Brushes standing -->
  <!-- Brush 1 tilted left -->
  <g transform="rotate(-15 36 45)">
    <rect x="35" y="14" width="4" height="40" rx="1.5" fill="#d4a373"/>
    <rect x="35" y="10" width="6" height="8" rx="1.5" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Brush 2 tilted right -->
  <g transform="rotate(12 44 45)">
    <rect x="42" y="12" width="4" height="42" rx="1.5" fill="#c48a56"/>
    <rect x="40" y="8" width="6" height="8" rx="1.5" fill="#0284c7" opacity="0.9"/>
  </g>
  <!-- Cup / Ceramic holder -->
  <rect x="28" y="44" width="24" height="26" rx="4" fill="url(#cup)"/>
  <ellipse cx="40" cy="44" rx="12" ry="3" fill="#2dd4bf"/>
</svg>
